name: Build desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "if ('v' + require('./desktop/package.json').version !== process.env.RELEASE_TAG) process.exit(1)"
      - run: npm test
      - run: npm run typecheck
      - run: npm run desktop:test
      - name: Package desktop app
        run: npm run desktop:dist -- --${{ matrix.platform }} --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify macOS ad-hoc signature
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          APP_BUNDLE="release/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/OfferDesk.app"
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"
          SIGNATURE_INFO="$(codesign --display --verbose=4 "$APP_BUNDLE" 2>&1)"
          [[ "$SIGNATURE_INFO" == *"Signature=adhoc"* ]]
      - name: Smoke-test installed application bundle
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "mac" ]; then
            export OFFERDESK_TEST_EXECUTABLE="$(find release -type f -path '*/OfferDesk.app/Contents/MacOS/OfferDesk' -print -quit)"
          else
            export OFFERDESK_TEST_EXECUTABLE="$PWD/release/win-unpacked/OfferDesk.exe"
          fi
          test -n "$OFFERDESK_TEST_EXECUTABLE"
          npx playwright test --config playwright.desktop.config.ts
      - uses: actions/upload-artifact@v4
        with:
          name: OfferDesk-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Generate checksums
        run: cd installers && sha256sum * > SHA256SUMS.txt
      - name: Publish or replace release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" installers/* --clobber
          else
            gh release create "$RELEASE_TAG" installers/* --draft --title "OfferDesk $RELEASE_TAG"
          fi
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > uploaded-release.json
          while read -r expected filename; do
            actual="$(jq -r --arg name "$filename" '.assets[] | select(.name == $name) | .digest' uploaded-release.json)"
            test "$actual" = "sha256:$expected"
          done < installers/SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest --title "OfferDesk $RELEASE_TAG" --notes-file docs/release-notes.md
