name: Build desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "if ('v' + require('./desktop/package.json').version !== process.env.RELEASE_TAG) process.exit(1)"
      - run: npm test
      - run: npm run typecheck
      - run: npm run desktop:test
      - name: Package desktop app
        run: npm run desktop:dist -- --${{ matrix.platform }} --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke-test installed application bundle
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "mac" ]; then
            export OFFERDESK_TEST_EXECUTABLE="$(find release -type f -path '*/OfferDesk.app/Contents/MacOS/OfferDesk' -print -quit)"
          else
            export OFFERDESK_TEST_EXECUTABLE="$PWD/release/win-unpacked/OfferDesk.exe"
          fi
          test -n "$OFFERDESK_TEST_EXECUTABLE"
          npx playwright test --config playwright.desktop.config.ts
      - uses: actions/upload-artifact@v4
        with:
          name: OfferDesk-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Generate checksums
        run: cd installers && sha256sum * > SHA256SUMS.txt
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" installers/* --prerelease --title "OfferDesk $RELEASE_TAG · 桌面预览版" --notes "Mac Apple Silicon / Intel 与 Windows x64 本地应用。下载安装后直接打开，无需 Node.js 或云服务。岗位、投递记录与截图保存在本机，支持内置中英文模型的离线 OCR 与岗位预填，保存前请核对识别结果。当前预览版未完成发行签名，系统可能提示开发者无法验证或阻止运行。各平台安装包均通过构建与应用重启测试，校验和见 SHA256SUMS.txt。详细说明见 docs/desktop.md。"
