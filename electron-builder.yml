appId: io.github.mzh0221.offerdesk
productName: OfferDesk
directories:
  app: desktop
  output: release
  buildResources: desktop/resources
files:
  - main.cjs
  - policy.cjs
  - preload.cjs
  - ocr.cjs
  - ocr-process.cjs
  - import-bridge.cjs
  - mcp-stdio.cjs
  - harness-config.cjs
  - auto-mcp.cjs
  - package.json
  - renderer-dist/**/*
  - '!node_modules/**/*'
extraResources:
  # Separate roots: electron-builder skips a node_modules directory at a copy root.
  - from: desktop/ocr-runtime/node_modules
    to: ocr-runtime/node_modules
  - from: desktop/ocr-runtime/models
    to: ocr-runtime/models
  - from: desktop/ocr-runtime/offline-worker.cjs
    to: ocr-runtime/offline-worker.cjs
  - from: LICENSE
    to: LICENSE
asar: true
npmRebuild: false
artifactName: OfferDesk-${version}-${os}-${arch}.${ext}
mac:
  # Free local integrity signature; does not provide Developer ID or notarization.
  identity: "-"
  notarize: false
  hardenedRuntime: true
  category: public.app-category.productivity
  target:
    - dmg
    - zip
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
publish: null
